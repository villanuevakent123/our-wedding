<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Groomsmen</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Georgia, serif;
            color: #111;
            background: #000;
        }

        .card {
            width: 90%;
            max-width: 650px;
            padding: 50px 30px;

            background: #fff;

            border: 1px solid #ddd;
            box-shadow: 0 0 40px rgba(255,255,255,0.15);
        }

        .flower {
            text-align: center;
            font-size: 42px;
        }

        h1 {
            text-align: center;

            font-size: 27px;
            font-weight: normal;

            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .subtitle {
            text-align: center;
            line-height: 1.8;
            margin: 25px auto 35px;
        }

        .list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .list li {
            padding: 16px 10px;

            border-bottom: 1px solid #ddd;

            font-size: 18px;
        }

        .number {
            color: #777;
            margin-right: 12px;
        }

        .back {
            display: block;

            width: fit-content;

            margin: 35px auto 0;
            padding: 13px 28px;

            color: #fff;
            background: #000;

            text-decoration: none;
            border: 1px solid #000;
        }

        .back:hover {
            color: #000;
            background: #fff;
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="flower">♔</div>

        <h1>Groomsmen</h1>

        <p class="subtitle">
            The gentlemen standing beside the groom
            on this special day.
        </p>

        <ul class="list">

            <li>
                <span class="number">01.</span>
                Michael Santos
            </li>

            <li>
                <span class="number">02.</span>
                Daniel Reyes
            </li>

            <li>
                <span class="number">03.</span>
                James Cruz
            </li>

            <li>
                <span class="number">04.</span>
                Robert Garcia
            </li>

            <li>
                <span class="number">05.</span>
                William Torres
            </li>

        </ul>

        <a href="index.html" class="back">
            ← BACK TO INVITATION
        </a>

    </div>

</body>
</html>
