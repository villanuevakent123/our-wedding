<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gift & Attire Guide — Kent & Noemae</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #fff;
            color: #2c3e50;
            font-family: 'Georgia', serif;
            line-height: 1.8;
            padding: 3rem 2rem;
            max-width: 600px;
            margin: 0 auto;
            border-left: 4px solid #8b3a3a;
            border-right: 4px solid #8b3a3a;
            min-height: 100vh;
        }
        .names {
            font-family: 'Brush Script MT', cursive;
            font-size: 2.8rem;
            text-align: center;
            color: #2c3e50;
            margin-bottom: 1rem;
        }
        .ampersand { color: #8b3a3a; }
        h1 {
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 1rem;
        }
        .divider {
            border-bottom: 1px solid #ccc;
            margin-bottom: 2rem;
        }
        .gift-text {
            text-align: center;
            font-size: 1.15rem;
            font-style: italic;
            margin-bottom: 3rem;
        }
        h2 {
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }
        .attire-text {
            text-align: center;
            font-size: 1.3rem;
            text-transform: uppercase;
            font-weight: bold;
            margin-bottom: 3rem;
        }
        .icons-row {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 4rem;
        }
        .icon svg {
            width: 80px;
            height: 80px;
            fill: #2c3e50;
        }
        .color-palette p {
            font-style: italic;
            margin-bottom: 0.5rem;
        }
        .color-swatch {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #2c3e50;
            margin: 0 auto;
        }
        .back-btn {
            display: inline-block;
            background: #2c3e50;
            color: #fff;
            padding: 0.9rem 2rem;
            text-decoration: none;
            border-radius: 4px;
        }
        .back-btn:hover { background: #8b3a3a; }
    </style>
</head>
<body>
    <h1 class="names">Kent <span class="ampersand">&</span> Noemae</h1>

    <h1>GIFT GUIDE</h1>
    <div class="divider"></div>

    <p class="gift-text">
        Your presence at our wedding is the greatest gift of all. However,<br>
        If you desire to give nonetheless,<br>
        a monetary gift for our future is the one we suggest.
    </p>

    <h2>ATTIRE</h2>
    <p class="attire-text">FORMAL OR SEMI FORMAL</p>

    <div class="icons-row">
        <div class="icon">
            <svg viewBox="0 0 100 100"><path d="M35,25 L65,25 L70,35 L60,40 L60,85 L40,85 L40,40 L30,35 Z M44,35 L56,35 L56,43 L44,43 Z"/></svg>
        </div>
        <div class="icon">
            <svg viewBox="0 0 100 100"><path d="M50,25 C60,25 66,35 66,45 L82,75 L72,80 L50,85 L28,80 L18,75 L34,45 C34,35 40,25 50,25 Z"/></svg>
        </div>
        <div class="icon color-palette">
            <p>Color Palette</p>
            <div class="color-swatch"></div>
        </div>
    </div>

    <a href="index.html" class="back-btn">← Back to Home</a>
</body>
</html>
