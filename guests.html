<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Wedding Guest List</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Georgia, serif;
            color: #111;

            background: #000;
        }

        .card {
            width: 90%;
            max-width: 650px;

            padding: 50px 30px;

            background: #fff;

            border: 1px solid #ddd;

            box-shadow: 0 0 40px rgba(255,255,255,0.15);
        }

        .flower {
            text-align: center;
            font-size: 42px;
            color: #000;
        }

        h1 {
            text-align: center;

            font-size: 25px;
            font-weight: normal;

            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .subtitle {
            text-align: center;

            line-height: 1.8;

            margin: 25px auto 35px;

            max-width: 500px;
        }

        .guest-list {
            list-style: none;

            padding: 0;
            margin: 0;
        }

        .guest-list li {
            padding: 15px 10px;

            border-bottom: 1px solid #ddd;

            font-size: 17px;
        }

        .guest-number {
            color: #777;

            margin-right: 12px;
        }

        .back {
            display: block;

            width: fit-content;

            margin: 35px auto 0;

            padding: 13px 30px;

            color: #fff;
            background: #000;

            text-decoration: none;

            border: 1px solid #000;

            transition: 0.3s;
        }

        .back:hover {
            background: #fff;
            color: #000;
        }

        @media (max-width: 500px) {

            .card {
                padding: 40px 20px;
            }

            h1 {
                font-size: 21px;
            }

            .guest-list li {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="flower">❦</div>

        <h1>Our Guest List</h1>

        <p class="subtitle">
            We are grateful to celebrate our special day
            with the people we love.
        </p>

        <ul class="guest-list">

            <li>
                <span class="guest-number">01.</span>
                Maria Santos
            </li>

            <li>
                <span class="guest-number">02.</span>
                Michael Santos
            </li>

            <li>
                <span class="guest-number">03.</span>
                Anna Reyes
            </li>

            <li>
                <span class="guest-number">04.</span>
                Daniel Reyes
            </li>

            <li>
                <span class="guest-number">05.</span>
                Sarah Cruz
            </li>

            <li>
                <span class="guest-number">06.</span>
                James Cruz
            </li>

            <li>
                <span class="guest-number">07.</span>
                Emily Garcia
            </li>

            <li>
                <span class="guest-number">08.</span>
                Robert Garcia
            </li>

        </ul>

        <a href="index.html" class="back">
            ← BACK TO INVITATION
        </a>

    </div>

</body>
</html>
