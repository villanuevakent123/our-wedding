<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Venue Map | Our Wedding</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Georgia, serif;
            color: #111;
            background: #000;

            padding: 30px 15px;
        }

        .card {
            width: 90%;
            max-width: 650px;
            padding: 45px 30px;

            background: #fff;
            text-align: center;

            border: 1px solid #ddd;
            box-shadow: 0 0 40px rgba(255,255,255,0.15);
        }

        .flower {
            font-size: 42px;
        }

        h1 {
            font-size: 18px;
            font-weight: normal;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 25px;
        }

        .venue-name {
            font-size: 32px;
            margin: 20px 0 10px;
        }

        .address {
            font-size: 16px;
            line-height: 1.7;
            color: #555;
            margin-bottom: 25px;
        }

        .map-container {
            width: 100%;
            height: 350px;
            margin: 25px 0;

            border: 1px solid #ddd;
            overflow: hidden;
        }

        .map-container iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .details {
            font-size: 16px;
            line-height: 1.8;
            margin: 25px auto;
        }

        .button {
            display: inline-block;
            margin: 7px 4px;
            padding: 13px 22px;

            color: #fff;
            background: #000;

            text-decoration: none;
            border: 1px solid #000;

            transition: 0.3s;
        }

        .button:hover {
            color: #000;
            background: #fff;
        }

        @media (max-width: 500px) {

            .card {
                padding: 40px 18px;
            }

            .venue-name {
                font-size: 26px;
            }

            .map-container {
                height: 280px;
            }

            .address,
            .details {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="flower">❦</div>

        <h1>Our Wedding Venue</h1>

        <div class="venue-name">
            Stalla Suites Events Place
        </div>

        <div class="address">
            Quezon City, Philippines
        </div>

        <div class="map-container">

            <iframe
                src="https://www.google.com/maps?q=14.632616,121.0194174&z=17&output=embed"
                allowfullscreen=""
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade">
            </iframe>

        </div>

        <div class="details">

            <strong>Wedding Ceremony</strong><br>

            Sunday, November 22, 2026<br>

            5:00 PM

            <br><br>

            We look forward to celebrating
            our special day with you.

        </div>

        <a
            href="https://www.google.com/maps/place/Stalla+Suites+Events+Place/@14.632616,121.0168425,17z"
            target="_blank"
            class="button">
            OPEN IN GOOGLE MAPS
        </a>

        <br>

        <a href="index.html" class="button">
            BACK TO INVITATION
        </a>

    </div>

</body>
</html>
