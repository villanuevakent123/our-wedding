<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Wedding</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

            font-family: Georgia, serif;
            color: #4d4038;

            background:
                linear-gradient(rgba(248,243,238,0.9), rgba(248,243,238,0.9)),
                url("https://images.unsplash.com/photo-1519225421980-715cb0215aed")
                center/cover;
        }

        .card {
            width: 90%;
            max-width: 650px;
            padding: 50px 30px;

            background: #fffdf9;
            border: 1px solid #dfd1c4;
            border-radius: 15px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        .flower {
            font-size: 40px;
            color: #a48a76;
        }

        h1 {
            font-size: 18px;
            font-weight: normal;
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        .names {
            font-size: 48px;
            color: #806653;
            margin: 25px 0;
        }

        .ampersand {
            font-size: 28px;
            color: #b99d85;
        }

        .message {
            font-size: 17px;
            line-height: 1.8;
        }

        .details {
            margin: 30px 0;
            line-height: 2;
        }

        .button {
            display: inline-block;
            padding: 13px 28px;

            color: white;
            background: #806653;

            text-decoration: none;
            border-radius: 25px;

            transition: 0.3s;
        }

        .button:hover {
            background: #5f4b3d;
        }

        @media (max-width: 500px) {
            .names {
                font-size: 36px;
            }

            .card {
                padding: 40px 20px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="flower">❀</div>

        <h1>We're Getting Married</h1>

        <div class="names">
            Kent
            <div class="ampersand">&</div>
            Noemae
        </div>

        <p class="message">
            Together with our families, we joyfully invite you
            to celebrate our wedding day with us.
        </p>

        <div class="details">
            <strong>Sunday, November 22, 2026</strong><br>
            5:00 PM<br><br>

            <strong>Garden Wedding Venue</strong><br>
            Manila, Philippines
        </div>

        <p class="message">
            Your presence will make our special day even more meaningful.
        </p>

        <!-- Opens the separate guest-list website -->
        <a href="guests.html" class="button">
            View Guest List →
        </a>

    </div>

</body>
</html>
