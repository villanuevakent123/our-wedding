<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Wedding</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Georgia, serif;
            color: #111;
            background: #000;
        }

        .card {
            width: 90%;
            max-width: 650px;
            padding: 55px 30px;

            background: #fff;
            text-align: center;

            border: 1px solid #ddd;
            box-shadow: 0 0 40px rgba(255,255,255,0.15);
        }

        .flower {
            font-size: 42px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 18px;
            font-weight: normal;
            letter-spacing: 5px;
            text-transform: uppercase;
        }

        .names {
            font-size: 50px;
            margin: 30px 0;
            line-height: 1.2;
        }

        .ampersand {
            font-size: 28px;
            color: #777;
            margin: 8px 0;
        }

        .message {
            font-size: 17px;
            line-height: 1.8;
            max-width: 500px;
            margin: 25px auto;
        }

        .details {
            margin: 30px 0;
            line-height: 2;
            font-size: 17px;
        }

        .buttons {
            margin-top: 30px;
        }

        .button {
            display: inline-block;
            margin: 7px 4px;
            padding: 13px 22px;

            color: #fff;
            background: #000;

            text-decoration: none;
            border: 1px solid #000;

            transition: 0.3s;
        }

        .button:hover {
            color: #000;
            background: #fff;
        }

        @media (max-width: 500px) {

            .card {
                padding: 45px 20px;
            }

            .names {
                font-size: 38px;
            }

            .message,
            .details {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="flower">❦</div>

        <h1>We're Getting Married</h1>

        <div class="names">
            John
            <div class="ampersand">&</div>
            Jane
        </div>

        <p class="message">
            Together with our families, we joyfully invite you
            to celebrate our wedding day with us.
        </p>

        <div class="details">

            <strong>Saturday, December 12, 2026</strong><br>

            4:00 PM<br><br>

            <strong>Garden Wedding Venue</strong><br>

            Manila, Philippines

        </div>

        <p class="message">
            Your presence will make our special day
            even more meaningful.
        </p>

        <div class="buttons">

            <a href="groomsmen.html" class="button">
                GROOMSMEN
            </a>

            <a href="bridesmaids.html" class="button">
                BRIDESMAIDS
            </a>

        </div>

    </div>

</body>
</html>
