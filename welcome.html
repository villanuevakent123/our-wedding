<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kent & Noemae — Wedding Invitation</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', serif;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.70), rgba(0,0,0,0.80)), url('prewedding-bg.jpg') center/cover no-repeat;
        }
        .lock-icon { font-size: 3rem; margin-bottom: 1rem; }
        .lock-title {
            font-size: 1.5rem;
            letter-spacing: 2px;
            margin-bottom: 0.5rem;
            color: #d4af37;
        }
        .lock-sub { color: #aaaaaa; margin-bottom: 2rem; font-size: 1rem; }
        .question {
            font-size: 1.1rem;
            color: #ffffff;
            margin-bottom: 0.5rem;
            text-align: left;
            width: 280px;
        }
        .pass-input {
            padding: 0.9rem 1.2rem;
            font-size: 1rem;
            border: 1px solid #555555;
            background: rgba(255,255,255,0.1);
            color: #ffffff;
            border-radius: 8px;
            width: 280px;
            margin-bottom: 1.2rem;
            outline: none;
        }
        .pass-input:focus { border-color: #8b3a3a; }
        .pass-btn {
            padding: 0.9rem 2.5rem;
            background: #8b3a3a;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        .pass-btn:hover { background: #a54848; }
        .error-msg {
            color: #ff6b6b;
            margin-top: 1.2rem;
            display: none;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div class="lock-icon">💍</div>
    <h1 class="lock-title">Tuklasin ang Imbitasyon</h1>
    <p class="lock-sub">Sagutin ang mga tanong upang makita ang imbitasyon</p>

    <label class="question">Ano ang First name ni Groom?</label>
    <input type="text" id="groomInput" class="pass-input" placeholder="Ilagay ang pangalan..." autocomplete="off">

    <label class="question">Ano ang First name ni Bride?</label>
    <input type="text" id="brideInput" class="pass-input" placeholder="Ilagay ang pangalan..." autocomplete="off">

    <br>
    <button class="pass-btn" onclick="checkAnswers()">Buksan ang Imbitasyon ✨</button>

    <p class="error-msg" id="errorMsg">❌ Mali ang isa o pareho. Subukan muli.</p>

<script>
// ✅ TAMANG SAGOT — HUWAG BAGUHIN MALIBAN KUNG KAILANGAN
const CORRECT_GROOM = "kent";
const CORRECT_BRIDE = "noemae";

function checkAnswers() {
    const groomName = document.getElementById('groomInput').value.trim().toLowerCase();
    const brideName = document.getElementById('brideInput').value.trim().toLowerCase();

    if (groomName === CORRECT_GROOM && brideName === CORRECT_BRIDE) {
        // ✅ TAMA — Pumunta sa imbitasyon
        window.location.href = "invitation.html";
    } else {
        // ❌ MALI — Ipakita ang mensahe
        document.getElementById('errorMsg').style.display = 'block';
        setTimeout(() => {
            document.getElementById('errorMsg').style.display = 'none';
        }, 3000);
    }
}

// Pindutin ang Enter para mag-submit
document.getElementById('brideInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') checkAnswers();
});
</script>

</body>
</html>
